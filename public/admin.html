<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IPTV PRO PANEL v5</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200">

<div id="login" class="fixed inset-0 flex items-center justify-center bg-slate-950">
  <div class="bg-slate-900 p-6 rounded-2xl w-80 shadow-2xl">
    <h2 class="text-xl mb-4 text-cyan-400 font-bold">Admin Login</h2>
    <input id="adminUser" placeholder="Admin User" class="bg-slate-800 p-2 rounded-xl w-full mb-3" />
    <input id="adminPass" type="password" placeholder="Admin Pass" class="bg-slate-800 p-2 rounded-xl w-full mb-4" />
    <button onclick="login()" class="bg-cyan-500 w-full py-2 rounded-xl hover:bg-cyan-600">Login</button>
  </div>
</div>

<div id="app" class="flex min-h-screen hidden">
  <aside class="w-64 bg-slate-900 p-5 shadow-2xl">
    <h1 class="text-2xl font-bold text-cyan-400 mb-4">IPTV v5</h1>
    <div class="text-sm text-slate-400">User Manager</div>
  </aside>

  <main class="flex-1 p-6">

    <div class="grid md:grid-cols-4 gap-4 mb-6">
      <input id="server" placeholder="Server" class="bg-slate-800 p-2 rounded-xl" />
      <input id="username" placeholder="Username" class="bg-slate-800 p-2 rounded-xl" />
      <input id="password" placeholder="Password" class="bg-slate-800 p-2 rounded-xl" />
      <input id="expire" type="date" class="bg-slate-800 p-2 rounded-xl" />
    </div>

    <button onclick="addUser()" class="bg-cyan-500 px-4 py-2 rounded-xl mb-6 hover:bg-cyan-600">Add User</button>

    <div class="flex justify-between mb-3">
      <input id="search" placeholder="Search user..." class="bg-slate-800 p-2 rounded-xl w-60" />
      <button onclick="exportCSV()" class="bg-indigo-500 px-4 py-2 rounded-xl hover:bg-indigo-600">Export CSV</button>
    </div>

    <div class="bg-slate-900 rounded-2xl overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-800 text-slate-400">
          <tr>
            <th class="p-3">User</th>
            <th>Days</th>
            <th>Status</th>
            <th>Renew</th>
            <th>Edit</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="table"></tbody>
      </table>
    </div>

  </main>
</div>

<script>
async function addUser(){
  const data={
    server:document.getElementById('server').value,
    username:document.getElementById('username').value,
    password:document.getElementById('password').value,
    expire:document.getElementById('expire').value
  };
  const r=await fetch('/add-user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  alert(await r.text());
  loadUsers();
}

async function loadUsers(){
  const r=await fetch('/users');
  const d=await r.json();
  const s=document.getElementById('search').value.toLowerCase();
  const table=document.getElementById('table');
  table.innerHTML='';
  d.forEach(u=>{
    if(!u.username.toLowerCase().includes(s)) return;
    let status=u.status==='Active'
      ?'<span class="text-green-400">Active</span>'
      :'<span class="text-red-400">Expired</span>';
    table.innerHTML+=`<tr class="border-b border-slate-800">
      <td class="p-2">${u.username}</td>
      <td>${u.days_left}</td>
      <td>${status}</td>
      <td>
        <button onclick="renewUser(${u.id},7)" class="bg-green-600 px-2 rounded">7</button>
        <button onclick="renewUser(${u.id},30)" class="bg-green-600 px-2 rounded">30</button>
        <button onclick="renewUser(${u.id},90)" class="bg-green-600 px-2 rounded">90</button>
      </td>
      <td><button onclick="editUser(${u.id},'${u.username}')" class="bg-yellow-500 px-2 rounded">Edit</button></td>
      <td><button onclick="deleteUser(${u.id})" class="bg-red-600 px-2 rounded">X</button></td>
    </tr>`;
  });
}

async function renewUser(id,days){
  await fetch('/renew/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({days:days})});
  loadUsers();
}

async function deleteUser(id){
  if(!confirm('Delete this user?')) return;
  await fetch('/delete-user/'+id,{method:'DELETE'});
  loadUsers();
}

async function editUser(id,oldUser){
  const username=prompt('New Username:',oldUser);
  const password=prompt('New Password:');
  const expire=prompt('New Expire Date (YYYY-MM-DD):');
  if(!username||!password||!expire) return;
  await fetch('/update-user/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password,expire})});
  loadUsers();
}

function exportCSV(){
  window.location='/export-csv';
}

document.getElementById('search').addEventListener('keyup',loadUsers);

async function login(){
  const username=document.getElementById('adminUser').value;
  const password=document.getElementById('adminPass').value;
  const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  const t=await r.text();
  if(t==='OK'){
    document.getElementById('login').style.display='none';
    document.getElementById('app').classList.remove('hidden');
    loadUsers();
  }else alert('Login Failed');
}
</script>

</body>
</html>
